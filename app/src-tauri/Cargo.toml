[package]
name = "vaultix-app"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "vaultix"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
libc = "0.2.191"
vaultix-core = { path = "../../crates/vaultix-core" }
psl = "2.1.245"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zeroize = "1.9.1"
ureq = "3.5.0"
tauri-plugin-global-shortcut = "2"
notify = "8.2.1"

[dev-dependencies]
tempfile = "3.27.0"
