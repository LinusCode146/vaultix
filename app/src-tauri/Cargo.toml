[package]
name = "vaultix-app"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "vaultix_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vaultix"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rand = "0.8"
libc = "0.2.191"
vaultix-core = { path = "../../crates/vaultix-core" }
vaultix-link = { path = "../../crates/vaultix-link" }
gethostname = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
psl = "2.1.245"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# macos-private-api only does something on macOS (transparent quick search window).
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zeroize = "1.9.1"
ureq = "3.5.0"

tauri-plugin-opener = "2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
trash = "5"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rqrr = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api"] }

[target.'cfg(windows)'.dependencies]
xcap = "0.7"
uds_windows = "1"
winreg = "0.56"
windows = { version = "0.62", features = [
  "Foundation",
  "Security_Credentials",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
notify = "8.2.1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
