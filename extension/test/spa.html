<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>No form (SPA)</title><style>body{font:15px system-ui,sans-serif;max-width:420px;margin:40px auto;padding:0 16px}label{display:block;margin:12px 0 4px}input{width:100%;padding:8px;font:inherit;box-sizing:border-box}button,.btn{margin-top:16px;padding:8px 16px;font:inherit;display:inline-block;border:1px solid #888;border-radius:6px;cursor:pointer}</style><script src="build/stub.js"></script></head><body><h1>Log in</h1><div id="app"><label for="user">Username</label><input id="user" name="username"><label for="pw">Password</label><input id="pw" type="password"><div class="btn" role="button" tabindex="0" id="go">Log in</div></div><p id="out"></p><script>/* React-style controlled input: only accepts values that come with an input event */const seen={};for(const id of ["user","pw"]){document.getElementById(id).addEventListener("input",e=>{seen[id]=e.target.value})}window.__seen=seen;document.getElementById("go").addEventListener("click",()=>{document.getElementById("out").textContent="logged in as "+(seen.user||"?")});</script><script src="../dist/content.js"></script></body></html>
