[package]
name = "vaultix-link"
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pairs a phone with a computer and syncs the vault folder between them over the local network."

[dependencies]
base64 = "0.22"
data-encoding = "2.11.1"
if-addrs = "0.15"
mdns-sd = "0.21"
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
vaultix-core = { path = "../vaultix-core" }
