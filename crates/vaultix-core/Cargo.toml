[package]
name = "vaultix-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false }
ciborium = "0.2.2"
csv = "1.4.0"
data-encoding = "2.11.1"
hmac = "0.12"
keepass = "0.17"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
psl = "2.1.245"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zeroize = { version = "1.9.1", features = ["derive"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
zxcvbn = "3.1.1"

[dev-dependencies]
keepass = { version = "0.17", features = ["save_kdbx4"] }
tempfile = "3.27.0"
