# Windows and Linux installers, attached to the GitHub release of a tag.
# The macOS app is built and signed locally with scripts/release.sh.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev rpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Tauri bundles the native host next to the app as an "external binary",
      # named with the target triple.
      - name: Native host
        shell: bash
        run: |
          cargo build --release -p vaultix-native-host
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          mkdir -p app/src-tauri/binaries
          cp "target/release/vaultix-native-host$ext" "app/src-tauri/binaries/vaultix-native-host-$triple$ext"

      - name: App
        working-directory: app
        shell: bash
        run: |
          npm ci
          npm run tauri build -- --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      - name: Collect installers
        shell: bash
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          mkdir -p out
          for f in target/release/bundle/nsis/*.exe; do [ -e "$f" ] && cp "$f" "out/Vaultix-$version-windows-x64-setup.exe"; done
          for f in target/release/bundle/deb/*.deb; do [ -e "$f" ] && cp "$f" "out/Vaultix-$version-linux-amd64.deb"; done
          for f in target/release/bundle/rpm/*.rpm; do [ -e "$f" ] && cp "$f" "out/Vaultix-$version-linux-x86_64.rpm"; done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: out/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber
